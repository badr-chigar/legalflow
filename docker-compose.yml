services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: legalflow
      POSTGRES_USER: legalflow
      POSTGRES_PASSWORD: legalflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legalflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: dev-insecure-change-me
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web
      POSTGRES_DB: legalflow
      POSTGRES_USER: legalflow
      POSTGRES_PASSWORD: legalflow
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
