# Blueprint Render — backend Django + PostgreSQL.
# New + → Blueprint → connecter le repo. Voir DEPLOY.md.
databases:
  - name: legalflow-db
    plan: free

services:
  - type: web
    name: legalflow-api
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    healthCheckPath: /api/schema/
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: legalflow-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        sync: false # à renseigner avec l'URL Vercel après le 1er déploiement
      - key: CSRF_TRUSTED_ORIGINS
        sync: false # idem
      - key: OTP_TTL_MINUTES
        value: "10"
      - key: OTP_MAX_ATTEMPTS
        value: "5"
